<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antioch Cemetery — Find a Plot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    --cream: #faf6f0;
    --cream-deep: #f2ead9;
    --ink: #2f4f3f;
    --ink-deep: #24392c;
    --gold: #8a6d2e;
    --maroon: #7a2f2f;
    --plot-dot: #9a9186;
  }
  body {
    font-family: 'EB Garamond', Georgia, serif;
    margin: 0;
    background: var(--cream);
    color: var(--ink-deep);
  }
  .logo-wrap { text-align: center; padding: 18px 16px 6px; background: var(--cream); }
  .logo-wrap img { width: 100%; max-width: 340px; height: auto; display: inline-block; }
  .tagline {
    text-align: center; font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.15em; color: var(--ink); letter-spacing: 0.04em;
    margin: 0 0 18px; font-weight: 600;
  }
  main { max-width: 1000px; margin: 0 auto; padding: 0 16px 32px; }
  .panel-row { display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px; }
  @media (min-width: 720px) {
    .panel-row { flex-direction: row-reverse; align-items: flex-start; }
    .search-panel { flex: 0 0 320px; }
    .info-panel { flex: 1; }
  }
  .search-panel, .info-panel { min-width: 0; }
  .search-bar { display: flex; gap: 8px; }
  .search-field { position: relative; flex: 1; display: flex; }
  .search-bar input {
    flex: 1; padding: 12px 38px 12px 14px; font-size: 1.05em; font-family: inherit;
    border: 1px solid var(--gold); border-radius: 3px; background: white; color: var(--ink-deep);
    width: 100%;
  }
  /* Clear button, inside the field. Selectors are scoped to .search-bar so
     they beat the `.search-bar button` rule, which otherwise gives this the
     Search button's padding and dark fill. Only appears once there's
     something to clear. */
  .search-bar .clear-btn {
    position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
    display: none; width: 25px; height: 25px; min-width: 25px;
    padding: 0; margin: 0; line-height: 1; letter-spacing: 0;
    font-family: Georgia, serif; font-size: 20px; font-weight: 400;
    border: none; border-radius: 50%; cursor: pointer;
    background: #e6ded0; color: #5b5346;
  }
  .search-bar .clear-btn:hover,
  .search-bar .clear-btn:active { background: var(--gold); color: var(--cream); }
  .search-bar .clear-btn.visible { display: flex; align-items: center; justify-content: center; }
  .search-bar input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .search-bar button {
    padding: 12px 22px; font-size: 1em; font-family: 'Playfair Display', Georgia, serif; font-weight: 600;
    background: var(--ink); color: var(--cream); border: none; border-radius: 3px; cursor: pointer;
    letter-spacing: 0.03em;
  }
  .search-bar button:hover { background: var(--ink-deep); }
  #info-card {
    display: none; background: white; border: 1px solid var(--cream-deep); border-left: 4px solid var(--gold);
    padding: 16px 18px; border-radius: 3px; box-shadow: 0 1px 4px rgba(47,79,63,0.08);
  }
  #info-card.visible { display: block; }
  #info-card .plot-no { font-family: 'Playfair Display', Georgia, serif; color: var(--gold); font-size: 0.9em; letter-spacing: 0.05em; text-transform: uppercase; }
  #info-card .name { font-family: 'Playfair Display', Georgia, serif; font-size: 1.4em; font-weight: 700; color: var(--ink-deep); margin-top: 2px; }
  #info-card .field { font-size: 1em; color: #555; margin-top: 4px; }
  #info-card .badge { color: white; font-size: 0.78em; padding: 3px 10px; border-radius: 3px; display: inline-block; margin-top: 8px; font-family: 'EB Garamond', serif; letter-spacing: 0.03em; }
  #results { margin-top: 8px; max-height: 40vh; overflow-y: auto; }
  .result-card {
    background: white; border: 1px solid var(--cream-deep); padding: 12px 14px; border-radius: 3px;
    margin-bottom: 8px; cursor: pointer; transition: border-color 0.15s;
  }
  .result-card:hover, .result-card:active { border-color: var(--gold); }
  .result-name { font-weight: 600; color: var(--ink-deep); }
  .empty-msg, .loading-msg { color: #8a8478; padding: 8px 0; font-style: italic; }
  #map-wrap {
    background: var(--cream); border: 1px solid var(--gold); border-radius: 4px;
    box-shadow: 0 2px 10px rgba(47,79,63,0.12); padding: 14px; position: relative;
  }
  #map-wrap::before {
    content: ""; position: absolute; inset: 5px; border: 1px solid rgba(138,109,46,0.35);
    border-radius: 2px; pointer-events: none;
  }
  #map { width: 100%; height: auto; display: block; }
  .fenceline { stroke: var(--ink); stroke-width: 0.7; fill: none; }
  .roadline { stroke: var(--ink); stroke-width: 0.5; fill: none; opacity: 0.75; }
  /* Only occupied graves show. Every plot still exists in the page, hidden,
     so the moment a burial is recorded that square appears on the next load
     -- but vacant ground stays clear on the public map. */
  .plot-marker { display: none; fill: var(--cream-deep); stroke: var(--ink); stroke-width: 0.35; }
  .plot-marker.occupied { display: inline; }
  .plot-label {
    display: none;
    font-family: 'EB Garamond', serif; font-size: 1.5px; text-anchor: middle;
    dominant-baseline: central; fill: var(--ink-deep); font-weight: 600;
    pointer-events: none;
  }
  .plot-label.occupied { display: inline; }
  .landmark rect { fill: var(--cream); stroke: var(--gold); stroke-width: 1; }
  .landmark-label { font-family: 'EB Garamond', serif; font-size: 8.5px; text-anchor: middle; fill: var(--ink-deep); font-weight: 600; }
  .road-label { font-family: 'EB Garamond', serif; font-size: 9px; fill: var(--ink); font-style: italic; }
  .compass circle { fill: var(--cream); stroke: var(--gold); stroke-width: 0.8; }
  .compass line { stroke: var(--ink); stroke-width: 0.6; }
  .compass-north { stroke: var(--maroon) !important; stroke-width: 1.1 !important; }
  .compass-label { font-family: 'EB Garamond', serif; font-size: 7px; text-anchor: middle; dominant-baseline: middle; fill: var(--ink-deep); font-weight: 600; }
  .compass-north-label { fill: var(--maroon); }
  .found-pin path { fill: var(--maroon); stroke: var(--cream); stroke-width: 0.8; }
  .found-pin-dot { fill: var(--cream); }
  .build-stamp { text-align: center; font-size: 0.72em; color: #a79f93; margin: 10px 0 18px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="logo-wrap">
  <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Antioch Cemetery">
</div>
<p class="tagline">Find a Plot</p>
<main>
  {% block content %}{% endblock %}
</main>
<p class="build-stamp">map build {{ build }} · {{ build_at }}</p>
<script>
let PLOTS = null;

async function loadPlots() {
  if (PLOTS) return PLOTS;
  const resp = await fetch('/api/plots');
  PLOTS = await resp.json();
  return PLOTS;
}

function hasName(p) {
  return !!((p.surname || '').trim() || (p.given_name || '').trim());
}

// Everyone on a double/triple stone shares one surveyed point, so they all
// resolve to the same square: whichever plot the server says the pin lives on.
function markerFor(num, p) {
  const at = (p && p.at) || num;
  return document.getElementById('plot-' + at) || document.getElementById('plot-' + num);
}

// Write the surname into every occupied square. Vacant squares keep the
// plot number they were built with.
async function showOccupiedPlots() {
  let plots;
  try {
    plots = await loadPlots();
  } catch (e) {
    return;   // squares keep their plot numbers rather than showing nothing
  }
  for (const [num, p] of Object.entries(plots)) {
    if (!hasName(p)) continue;
    const marker = markerFor(num, p);
    if (!marker) continue;
    marker.classList.add('occupied');
    const label = document.getElementById('plot-label-' + marker.id.slice(5));
    if (label) {
      // Field rule 2: a numbered plaque with no name. The plaque number
      // lives in given_name and is what identifies the grave.
      const sn = (p.surname || '').trim();
      label.textContent = sn === 'Unknown'
        ? ('No. ' + (p.given_name || '').trim()).trim()
        : (sn || (p.given_name || '').trim());
      label.classList.add('occupied');
    }
  }
}

function showInfoCard(num, p) {
  const card = document.getElementById('info-card');
  const name = [p.given_name, p.surname].filter(Boolean).join(' ') || '(name not yet on file)';
  const badge = p.badge ? `<div class="badge" style="background:${p.badge.color}">${p.badge.label}</div>` : '';
  card.innerHTML = `
    <div class="plot-no">Plot ${num}</div>
    <div class="name">${name}</div>
    ${p.dob ? `<div class="field">Date of Birth: ${p.dob}</div>` : ''}
    ${p.dod ? `<div class="field">Date of Death: ${p.dod}</div>` : ''}
    ${badge}
  `;
  card.classList.add('visible');
}

function hideInfoCard() {
  document.getElementById('info-card').classList.remove('visible');
}

async function doSearch() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const resultsEl = document.getElementById('results');
  hidePin();
  hideInfoCard();
  resultsEl.innerHTML = '';
  if (!q) return;

  syncClearButton();
  resultsEl.innerHTML = '<div class="loading-msg">Searching...</div>';
  const plots = await loadPlots();
  resultsEl.innerHTML = '';

  const qWords = q.split(/\s+/).filter(Boolean);
  const matches = Object.entries(plots).filter(([num, p]) => {
    if (num === q) return true;
    const fullName = `${p.given_name} ${p.surname}`.toLowerCase();
    return qWords.length > 0 && qWords.every(w => fullName.includes(w));
  });

  if (matches.length === 0) {
    resultsEl.innerHTML = '<div class="empty-msg">No matches found.</div>';
    return;
  }

  if (matches.length === 1) {
    const [num, p] = matches[0];
    showInfoCard(num, p);
    showPin(num, p);
    return;
  }

  matches.forEach(([num, p]) => {
    const card = document.createElement('div');
    card.className = 'result-card';
    const name = [p.given_name, p.surname].filter(Boolean).join(' ') || '(name not yet on file)';
    const dates = [p.dob, p.dod].filter(Boolean).join(' – ');
    const badge = p.badge ? `<span style="color:${p.badge.color}; font-weight:600;">${p.badge.label}</span>` : '';
    card.innerHTML = `<span class="result-name">${name}</span> — Plot ${num} ${dates ? '(' + dates + ')' : ''} ${badge}`;
    card.onclick = () => {
      resultsEl.innerHTML = '';
      showInfoCard(num, p);
      showPin(num, p);
    };
    resultsEl.appendChild(card);
  });
}

// Wipe the search and everything it put on the page, ready for the next one.
function clearSearch() {
  const q = document.getElementById('q');
  q.value = '';
  document.getElementById('results').innerHTML = '';
  hideInfoCard();
  hidePin();
  syncClearButton();
  q.focus();
}

function syncClearButton() {
  const btn = document.getElementById('clear-search');
  if (!btn) return;
  btn.classList.toggle('visible', document.getElementById('q').value.trim() !== '');
}

function hidePin() {
  document.getElementById('found-pin').setAttribute('visibility', 'hidden');
}

function showPin(num, p) {
  const marker = markerFor(num, p);
  const pin = document.getElementById('found-pin');
  if (!marker) return;
  const x = marker.getAttribute('data-cx') || marker.getAttribute('cx');
  const y = marker.getAttribute('data-cy') || marker.getAttribute('cy');
  pin.setAttribute('transform', `translate(${x},${y})`);
  pin.setAttribute('visibility', 'visible');
  marker.scrollIntoView({behavior: 'smooth', block: 'center', inline: 'center'});
}

document.addEventListener('DOMContentLoaded', () => {
  const q = document.getElementById('q');
  if (q) {
    q.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
    q.addEventListener('input', syncClearButton);
  }
  syncClearButton();
  showOccupiedPlots();
});
</script>
</body>
</html>
